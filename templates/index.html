<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Detection &amp; Recognition System</title>
    <style>
        /* ── Reset & Base ─────────────────────────────────────────── */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0F172A;
            color: #E2E8F0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Header ───────────────────────────────────────────────── */
        header {
            background: #1E293B;
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
        }
        header h1 { font-size: 1.25rem; font-weight: 600; color: #F8FAFC; }
        .badge {
            background: #3B82F6;
            color: #fff;
            padding: 4px 12px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        /* ── Main layout ──────────────────────────────────────────── */
        .container {
            flex: 1;
            display: flex;
            gap: 16px;
            padding: 16px;
            overflow: hidden;
        }

        /* Left panel — webcam */
        .left-panel {
            flex: 2;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .video-wrapper {
            position: relative;
            background: #1E293B;
            border-radius: 12px;
            overflow: hidden;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #334155;
        }
        #videoElement {
            width: 100%;
            max-height: 100%;
            display: block;
            object-fit: contain;
        }
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #captureCanvas { display: none; }

        .video-controls {
            display: flex;
            gap: 10px;
        }
        .video-controls button {
            flex: 1;
        }

        /* Right panel — register + list */
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 280px;
            max-width: 360px;
        }

        .card {
            background: #1E293B;
            border-radius: 12px;
            padding: 16px;
            border: 1px solid #334155;
        }
        .card h2 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #94A3B8;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        /* Form */
        .form-group { margin-bottom: 12px; }
        .form-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.85rem;
            color: #94A3B8;
        }
        .form-group input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            background: #0F172A;
            color: #E2E8F0;
            font-size: 0.9rem;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3B82F6;
        }

        /* Buttons */
        button, .btn {
            cursor: pointer;
            border: none;
            border-radius: 8px;
            padding: 10px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: background 0.15s;
        }
        .btn-primary {
            background: #3B82F6;
            color: #fff;
        }
        .btn-primary:hover { background: #2563EB; }
        .btn-primary:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        .btn-danger {
            background: #EF4444;
            color: #fff;
            padding: 4px 10px;
            font-size: 0.75rem;
        }
        .btn-danger:hover { background: #DC2626; }
        .btn-secondary {
            background: #334155;
            color: #E2E8F0;
        }
        .btn-secondary:hover { background: #475569; }

        /* Face list */
        .face-list {
            max-height: 340px;
            overflow-y: auto;
        }
        .face-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #334155;
        }
        .face-item:last-child { border-bottom: none; }
        .face-item-info { flex: 1; }
        .face-item-name {
            font-weight: 600;
            color: #F8FAFC;
            font-size: 0.9rem;
        }
        .face-item-meta {
            font-size: 0.7rem;
            color: #64748B;
        }
        .empty-state {
            text-align: center;
            padding: 24px 0;
            color: #64748B;
            font-size: 0.85rem;
        }

        /* ── Bottom bar ───────────────────────────────────────────── */
        .bottom-bar {
            background: #1E293B;
            padding: 8px 24px;
            display: flex;
            gap: 24px;
            font-size: 0.8rem;
            color: #94A3B8;
            border-top: 1px solid #334155;
        }
        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
            vertical-align: middle;
        }
        .status-dot.connected { background: #22C55E; }
        .status-dot.disconnected { background: #EF4444; }

        /* ── Toast ────────────────────────────────────────────────── */
        .toast-container {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.85rem;
            animation: slideIn 0.25s ease-out;
            max-width: 360px;
        }
        .toast.success { background: #16A34A; }
        .toast.error   { background: #DC2626; }
        .toast.info    { background: #3B82F6; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to   { transform: translateX(0);    opacity: 1; }
        }
    </style>
</head>
<body>

<!-- Header -->
<header>
    <h1>Face Detection &amp; Recognition</h1>
    <span class="badge">YOLOv8 + OpenCV</span>
</header>

<!-- Main -->
<div class="container">

    <!-- Left panel — Webcam -->
    <div class="left-panel">
        <div class="video-wrapper">
            <video id="videoElement" autoplay muted playsinline></video>
            <canvas id="overlayCanvas"></canvas>
            <canvas id="captureCanvas"></canvas>
        </div>
        <div class="video-controls">
            <button class="btn btn-primary" id="btnStart" onclick="toggleDetection()">
                Start Detection
            </button>
            <button class="btn btn-secondary" onclick="loadFaceList()">
                Refresh List
            </button>
        </div>
    </div>

    <!-- Right panel -->
    <div class="right-panel">
        <!-- Register card -->
        <div class="card">
            <h2>Register Face</h2>
            <div class="form-group">
                <label for="nameInput">Person Name</label>
                <input type="text" id="nameInput" placeholder="Enter name …"
                       maxlength="50" />
            </div>
            <button class="btn btn-primary" style="width:100%"
                    id="btnRegister" onclick="registerFace()">
                Capture &amp; Register
            </button>
        </div>

        <!-- Faces list card -->
        <div class="card" style="flex:1; display:flex; flex-direction:column;">
            <h2>Registered Faces (<span id="faceCount">0</span>)</h2>
            <div class="face-list" id="faceList">
                <div class="empty-state">No faces registered yet.</div>
            </div>
        </div>
    </div>
</div>

<!-- Bottom bar -->
<div class="bottom-bar">
    <span>
        <span class="status-dot disconnected" id="statusDot"></span>
        <span id="statusText">Disconnected</span>
    </span>
    <span>FPS: <strong id="fpsDisplay">0</strong></span>
    <span>Faces in frame: <strong id="frameCount">0</strong></span>
</div>

<!-- Toast container -->
<div class="toast-container" id="toastContainer"></div>

<script>
/* ================================================================
   Face Detection & Recognition — Frontend Controller
   ================================================================ */

// ── State ───────────────────────────────────────────────────────
let video       = null;
let overlay     = null;
let capture     = null;
let ctx         = null;
let capCtx      = null;
let detecting   = false;
let loopId      = null;
let fpsFrames   = [];
const FPS_WINDOW = 30;
const API_BASE   = '';  // same origin

// ── Init ────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
    video   = document.getElementById('videoElement');
    overlay = document.getElementById('overlayCanvas');
    capture = document.getElementById('captureCanvas');
    ctx     = overlay.getContext('2d');
    capCtx  = capture.getContext('2d');
    initWebcam();
    loadFaceList();
});

/**
 * Request webcam access and pipe the stream into the <video> element.
 */
function initWebcam() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showToast('Webcam API not available in this browser.', 'error');
        return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
        .then(stream => {
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                overlay.width  = video.videoWidth;
                overlay.height = video.videoHeight;
                capture.width  = video.videoWidth;
                capture.height = video.videoHeight;
                setConnected(true);
            };
        })
        .catch(err => {
            console.error('Webcam error:', err);
            showToast('Camera permission denied or unavailable.', 'error');
            setConnected(false);
        });
}

/**
 * Grab the current video frame and return a base64 JPEG string.
 * @returns {string} base64 data URI
 */
function captureFrame() {
    capCtx.drawImage(video, 0, 0, capture.width, capture.height);
    return capture.toDataURL('image/jpeg', 0.85);
}

// ── Detection loop ──────────────────────────────────────────────

/**
 * Toggle the 200 ms detection interval on/off.
 */
function toggleDetection() {
    if (detecting) {
        stopDetectionLoop();
    } else {
        startDetectionLoop();
    }
}

/**
 * Begin sending frames to `/detect_faces` every 200 ms.
 */
function startDetectionLoop() {
    detecting = true;
    document.getElementById('btnStart').textContent = 'Stop Detection';
    loopId = setInterval(async () => {
        const t0 = performance.now();
        try {
            const b64   = captureFrame();
            const resp  = await fetch(`${API_BASE}/detect_faces`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: b64 }),
            });
            if (!resp.ok) {
                const err = await resp.json();
                console.warn('detect_faces error:', err);
                return;
            }
            const data = await resp.json();
            drawResults(ctx, data.faces || []);
            document.getElementById('frameCount').textContent =
                data.count || 0;
        } catch (e) {
            console.error('Detection loop error:', e);
        }
        updateFPS(performance.now() - t0);
    }, 200);
}

/**
 * Stop the detection interval.
 */
function stopDetectionLoop() {
    detecting = false;
    clearInterval(loopId);
    loopId = null;
    document.getElementById('btnStart').textContent = 'Start Detection';
    ctx.clearRect(0, 0, overlay.width, overlay.height);
}

// ── Drawing ─────────────────────────────────────────────────────

/**
 * Draw bounding boxes + labels on the overlay canvas.
 * @param {CanvasRenderingContext2D} canvas
 * @param {Array} faces
 */
function drawResults(canvas, faces) {
    canvas.clearRect(0, 0, overlay.width, overlay.height);

    // Scale factors (canvas CSS size vs video resolution can differ)
    const sx = overlay.width  / (video.videoWidth  || 1);
    const sy = overlay.height / (video.videoHeight || 1);

    faces.forEach(f => {
        const [x1, y1, x2, y2] = f.bbox;
        const rx = x1 * sx,  ry = y1 * sy;
        const rw = (x2 - x1) * sx, rh = (y2 - y1) * sy;

        const known = f.name !== 'Unknown';
        const color = known ? '#22C55E' : '#EF4444';

        canvas.strokeStyle = color;
        canvas.lineWidth   = 2;
        canvas.strokeRect(rx, ry, rw, rh);

        // Label background
        let label = f.name;
        if (f.confidence) label += ` ${(f.confidence * 100).toFixed(0)}%`;
        if (f.similarity > 0) label += ` sim:${(f.similarity * 100).toFixed(0)}%`;

        canvas.font = '14px Segoe UI, sans-serif';
        const tw = canvas.measureText(label).width + 8;
        canvas.fillStyle = color;
        canvas.fillRect(rx, ry - 22, tw, 20);
        canvas.fillStyle = '#fff';
        canvas.fillText(label, rx + 4, ry - 7);
    });
}

// ── FPS ─────────────────────────────────────────────────────────

/**
 * Update the rolling-average FPS display.
 * @param {number} elapsed milliseconds for last round-trip
 */
function updateFPS(elapsed) {
    fpsFrames.push(elapsed);
    if (fpsFrames.length > FPS_WINDOW) fpsFrames.shift();
    const avg = fpsFrames.reduce((a, b) => a + b, 0) / fpsFrames.length;
    const fps = avg > 0 ? (1000 / avg).toFixed(1) : '0';
    document.getElementById('fpsDisplay').textContent = fps;
}

// ── Registration ────────────────────────────────────────────────

/**
 * Capture the current frame and POST it with the entered name.
 */
async function registerFace() {
    const nameInput = document.getElementById('nameInput');
    const name = nameInput.value.trim();
    if (!name) {
        showToast('Please enter a name.', 'error');
        return;
    }
    const btn = document.getElementById('btnRegister');
    btn.disabled = true;
    try {
        const b64 = captureFrame();
        const resp = await fetch(`${API_BASE}/register_face`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: b64, name }),
        });
        const data = await resp.json();
        if (resp.ok && data.success) {
            showToast(data.message, 'success');
            nameInput.value = '';
            loadFaceList();
        } else {
            showToast(data.error || 'Registration failed.', 'error');
        }
    } catch (e) {
        console.error('Register error:', e);
        showToast('Network error during registration.', 'error');
    } finally {
        btn.disabled = false;
    }
}

// ── Face list ───────────────────────────────────────────────────

/**
 * GET /faces and render the registered faces list.
 */
async function loadFaceList() {
    try {
        const resp = await fetch(`${API_BASE}/faces`);
        const data = await resp.json();
        const list = document.getElementById('faceList');
        document.getElementById('faceCount').textContent = data.total || 0;

        if (!data.faces || data.faces.length === 0) {
            list.innerHTML =
                '<div class="empty-state">No faces registered yet.</div>';
            return;
        }

        list.innerHTML = data.faces.map(f => `
            <div class="face-item">
                <div class="face-item-info">
                    <div class="face-item-name">${esc(f.name)}</div>
                    <div class="face-item-meta">
                        Seen ${f.recognition_count}x &middot;
                        ${new Date(f.registered_at).toLocaleDateString()}
                    </div>
                </div>
                <button class="btn btn-danger"
                        onclick="deleteFace('${esc(f.name)}')">
                    Delete
                </button>
            </div>
        `).join('');
    } catch (e) {
        console.error('Load faces error:', e);
    }
}

/**
 * Confirm and DELETE /faces/<name>, then reload the list.
 * @param {string} name
 */
async function deleteFace(name) {
    if (!confirm(`Delete "${name}" from the database?`)) return;
    try {
        const resp = await fetch(`${API_BASE}/faces/${encodeURIComponent(name)}`, {
            method: 'DELETE',
        });
        const data = await resp.json();
        if (resp.ok && data.success) {
            showToast(`Deleted "${name}".`, 'info');
            loadFaceList();
        } else {
            showToast(data.error || 'Delete failed.', 'error');
        }
    } catch (e) {
        console.error('Delete error:', e);
        showToast('Network error during deletion.', 'error');
    }
}

// ── Toast ───────────────────────────────────────────────────────

/**
 * Show an auto-dismiss notification.
 * @param {string} message
 * @param {'success'|'error'|'info'} type
 */
function showToast(message, type = 'info') {
    const container = document.getElementById('toastContainer');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = message;
    container.appendChild(el);
    setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 300);
    }, 3000);
}

// ── Helpers ─────────────────────────────────────────────────────

/**
 * Escape HTML to prevent XSS in dynamic content.
 * @param {string} s
 * @returns {string}
 */
function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

/**
 * Update the connection-status indicator.
 * @param {boolean} connected
 */
function setConnected(connected) {
    const dot  = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    if (connected) {
        dot.className  = 'status-dot connected';
        text.textContent = 'Camera Connected';
    } else {
        dot.className  = 'status-dot disconnected';
        text.textContent = 'Disconnected';
    }
}
</script>
</body>
</html>
